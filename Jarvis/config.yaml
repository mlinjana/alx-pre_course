# JARVIS settings. You can edit this file in Notepad. Restart JARVIS after saving.

brains:
  reflex:                       # answers first, instantly, or hands the request on
    model: claude-haiku-5-5
    effort: low                 # low | medium | high  (lower = faster and cheaper)
    max_tokens: 4000
  main:                         # everyday tasks, with tools
    model: claude-sonnet-5-5
    effort: low                 # Anthropic suggests low or medium for chat; raise to medium if answers feel thin
    max_tokens: 16000
  deep:                         # research, planning, reports - runs in the background
    model: claude-fable-5-2
    effort: high
    max_tokens: 64000
    # If the deep model declines a request for safety reasons, let Anthropic
    # re-run it on a fallback model automatically. Set to false to switch off.
    refusal_fallback: true

# Prices in US dollars per one million tokens, used only for the cost estimate
# in the logs. These were correct for the docs I read on 2026-11-13 - check
# https://platform.claude.com/docs/en/about-claude/pricing and update if they change.
# cache_read / cache_write are the prices for cached input tokens.
prices:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
    # Haiku 5.5 costs more when one prompt is longer than 100,000 tokens.
    long_prompt_over: 100000
    long_input: 0.50
    long_output: 2.50
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.10
    cache_write: 2.50
  claude-fable-5-2:
    input: 8.00
    output: 40.00
    cache_read: 0.20
    cache_write: 10.00

memory:
  recent_messages: 12           # how many latest messages are sent word for word
  summarise_after: 24           # when more than this many are stored, older ones are summarised
  facts_in_prompt: 40           # how many remembered facts JARVIS always has in view

# Apps JARVIS is allowed to open. Left side = what you say, right side = what
# Windows runs (the same thing you would type in the Win+R "Run" box).
# Add your own lines here. JARVIS cannot open anything that is not on this list.
apps:
  notepad: notepad.exe
  calculator: calc.exe
  paint: mspaint.exe
  file explorer: explorer.exe
  explorer: explorer.exe
  settings: "ms-settings:"
  edge: msedge
  chrome: chrome
  word: winword
  excel: excel
  powerpoint: powerpnt
  outlook: outlook
  task manager: taskmgr.exe
  command prompt: cmd.exe

# ---- Voice ---------------------------------------------------------------
voice:
  enabled: true                 # false = text chat only
  hotkey: f9                    # hold this key to talk; tap it to make JARVIS stop talking
  voice: Alan (British man)     # starting voice; you can also pick one in the window
  speech_to_text_device: auto   # auto = use an NVIDIA graphics card if it works, else the processor; or cpu
  whisper_model: base.en        # tiny.en = faster, less accurate; small.en = slower, more accurate
  end_silence_seconds: 0.6      # how long a pause means "I've finished speaking"
  wait_for_speech_seconds: 6    # after "Jarvis", how long to wait for you to say something
  wake_word_threshold: 0.25     # lower = wakes more easily (and more often by mistake)
  wake_word_boost: 1.0          # higher = wakes more easily
  speak_typed_replies: false    # true = also read out replies to typed messages

# ---- Research agent ------------------------------------------------------
# Runs on the deep brain with Anthropic's web search and web fetch tools.
research:
  max_searches: 20              # searches per job; at the limit JARVIS stops and asks you
  max_cost_usd: 3.00            # estimated cost per job; at the limit JARVIS stops and asks you
  max_pages: 40                 # most pages one job may open
  max_page_tokens: 8000         # how much of each page is read (bigger = more thorough, dearer)
  search_price_per_1000: 10.00  # Anthropic's web search fee in dollars; opening pages has no extra fee
  web_search_tool: web_search_20260318   # tool versions, from Anthropic's docs on 2026-11-13
  web_fetch_tool: web_fetch_20260318

# ---- Computer control: three safety tiers --------------------------------
# You may move an action DOWN the list to make JARVIS more careful (for example
# put open_app_or_website under tier_2_ask_first, or any action under
# tier_3_never). Ask-first actions can never be moved up to tier 1; JARVIS
# ignores that.
computer_control:
  enabled: true
  allowed_folders:              # file actions work only inside these
    - workspace                 # = the workspace folder inside the Jarvis folder (C:\Jarvis\workspace)
    - Documents
    - Downloads
  kill_switch_hotkey: ctrl+alt+k   # stops every action and background job at once
  confirm_timeout_seconds: 120     # no answer in this time counts as "no"

  tier_1_no_ask:                # done straight away
    - open_app_or_website
    - search_files
    - list_folder
    - read_text_file
    - set_volume
    - take_screenshot           # for JARVIS's own eyes; never saved
  tier_2_ask_first:             # JARVIS shows and says exactly what will happen, then waits for "yes"
    - create_text_file
    - move_or_rename
    - move_to_recycle_bin       # the only way anything is "deleted"; you can restore it
    - run_powershell
    - type_text
    - fill_form
    - control_screen
  tier_3_never:                 # no tool exists for these, and JARVIS's code blocks the known routes
    - delete_permanently
    - make_payments
    - send_emails_or_messages
    - change_passwords_or_security_settings
    - install_software

  # Controlling apps through the screen with the mouse and keyboard
  # (Anthropic's computer use tool). OFF until you switch it on - read the
  # note in HOW_TO_USE.md first.
  screen_control:
    enabled: false
    ask: every_action           # every_action = ask before each click and keystroke; once = ask per task only
    max_steps: 30

# ---- Speed ----------------------------------------------------------------
performance:
  prewarm: true                 # at start-up, open the connection and cache the fixed prompts
