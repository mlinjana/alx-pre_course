<h2>Choose a new password</h2>
<p>Someone asked to reset the password for your MFG account. If it was you, use this link. It works once.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/account/update-password">Choose a new password</a></p>
<p>If you didn't ask, you can ignore this email. Your password stays the same.</p>
