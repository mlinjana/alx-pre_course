<style>

  color-scheme:dark;

*{box-sizing:border-box}
html,body{background:var(--deep)}
body{color:var(--cream);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
.sample{margin-top:12px;border:1px dashed rgba(242,209,136,.4);background:rgba(242,209,136,.07);border-radius:6px;padding:10px 14px;font-size:13px;color:var(--gold2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
header.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px;border-bottom:1px solid var(--soft)}
.brand b{display:block;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--gold);font-weight:600}
.brand span{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid rgba(245,240,228,.2);border-radius:5px;overflow:hidden;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:9px 14px;font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--deep)}
.seg button:focus-visible{outline:2px solid var(--gold2);outline-offset:-2px}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--muted)}
select,input,textarea{font:inherit;color:var(--cream);background:var(--deep);border:1px solid rgba(245,240,228,.18);border-radius:4px;padding:9px 10px;min-width:0}

.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--gold)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,5vw,38px);line-height:1.08;margin:6px 0 4px;text-wrap:balance}

h2{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin:0}
h3{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--gold2)}
.muted{color:var(--muted)}.note{font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--soft);border-radius:6px;padding:16px;position:relative}
.ticks::before,.ticks::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--gold);border-style:solid;pointer-events:none}
.ticks::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.ticks::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:13px;padding:10px 16px;border-radius:4px;display:inline-flex;align-items:center;gap:8px}
.btn.gold{background:var(--gold);color:var(--deep)}.btn.gold:hover{background:var(--gold2)}
.btn.ghost{border:1px solid rgba(245,240,228,.25)}.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.small{font-size:11px;padding:7px 11px}
.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.chip{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap;display:inline-block}
.chip.red{background:var(--redbg);color:var(--red)}.chip.amber{background:var(--amberbg);color:var(--amber)}.chip.green{background:var(--greenbg);color:var(--green)}.chip.gold{background:rgba(227,179,65,.15);color:var(--gold2)}.chip.grey{background:rgba(245,240,228,.08);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* coach layout */
.coach{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px}
@media(min-width:920px){.coach{grid-template-columns:360px 1fr}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--soft)}
.tabs button{all:unset;cursor:pointer;padding:10px 12px;font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--gold);border-color:var(--gold)}
.tabs button:focus-visible{outline:2px solid var(--gold2)}
.clist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.citem{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px;border-radius:6px;background:var(--panel);border:1px solid var(--soft)}
.citem:hover{border-color:rgba(227,179,65,.4)}

.citem .nm{font-weight:600}
.citem .sc{font-family:var(--mono);font-weight:700;color:var(--gold);text-align:right}
.citem .sub{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.meter{height:5px;background:rgba(245,240,228,.08);border-radius:3px;overflow:hidden;grid-column:1/-1}
.meter i{display:block;height:100%;background:var(--gold)}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;background:#020408;border:1px solid #1d2638;border-radius:6px;padding:10px}

.flap .k{font-family:var(--display);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.flap .v{font-family:var(--mono);font-weight:700;font-size:clamp(18px,3vw,24px);color:var(--gold);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.flap .s{font-size:11px;color:var(--muted)}
.flap.red .v{color:var(--red)}.flap.green .v{color:var(--green)}.flap.amber .v{color:var(--amber)}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:8px;background:rgba(245,240,228,.08);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--gold)}
.bar > span:last-child{font-family:var(--mono);text-align:right;color:var(--gold2)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--display);font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--soft)}
td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.n{text-align:right}
.tbl{overflow-x:auto}
.two{display:grid;grid-template-columns:1fr;gap:14px}

.nt{border-left:2px solid var(--gold);padding:4px 0 4px 12px}

.done{color:var(--muted);text-decoration:line-through}
.lock{text-align:center;padding:40px 16px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}

.switch input::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--cream);top:3px;left:3px;transition:left .2s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:23px}
.switch input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--deep);padding:10px 16px;border-radius:4px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);z-index:5}
svg text{font-family:var(--mono)}

.dist div{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--muted);text-align:center}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function stats(c){
 if(!c.consent||!c.history.length)return null;
 const start=c.history[0].t,latest=c.history[c.history.length-1].t,prev=c.history.length>1?c.history[c.history.length-2].t:null;

 const closed=c.startAcc?Math.max(0,c.startAcc-c.openAcc):0;
 const months=[monthsBack(0),monthsBack(1),monthsBack(2)];
 const upd=months.filter(m=>c.history.some(h=>h.m===m)).length;
 const parts={
  reduced:Math.min(1,reduced/0.5)*W.reduced,
  closed:c.startAcc?closed/c.startAcc*W.closed:0,
  updates:upd/3*W.updates,
  nocredit:c.newCredit?0:W.nocredit};
 const score=Math.round(parts.reduced+parts.closed+parts.updates+parts.nocredit);
 return {start,latest,prev,reduced,closed,upd,parts,score,change:latest-start};
}

function rungOf(load){if(load===null||load===undefined)return 1;return load>50?1:load>=40?2:load>=35?3:load>=25?4:5}
function stageOf(c){

  1:[["Pay covers essentials plus minimum payments",covers],["No new credit this month",!c.newCredit],["Not borrowing to pay debts",!c.borrowing]],

  3:[["Something you own pays you every month",asset]],
  4:[["What you own pays for how you live",assetCovers]],5:[]};

 if(now.stage>was.stage)return {kind:"upStage",d,txt:`New stage: ${STAGES[now.stage-1].name}. You earned this.`};
 if(now.stage<was.stage)return {kind:"downStage",d,txt:`Your numbers moved you back to ${STAGES[now.stage-1].name} this month. That's information, not a verdict. Your coach will help you find what changed.`};
 if(d>0)return {kind:"up",d,txt:"You moved up a rung this month. Keep going."};

function chart(h,w=520){

 const e=Math.pow(10,Math.floor(Math.log10(max)));const f=max/e;const nice=(f<=1?1:f<=2?2:f<=5?5:10)*e;
 const y=v=>pt+(H-pt-pb)*(1-v/nice);const bw=Math.min(40,(w-pl-10)/h.length*.6);let g="";
 for(let i=0;i<=4;i++){const v=nice*i/4;g+=`<line x1="${pl}" x2="${w-6}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(245,240,228,.08)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#A7AFC0">${R(v)}</text>`}
 h.forEach((p,i)=>{const cx=pl+(i+.5)*(w-pl-6)/h.length;const last=i===h.length-1;
  g+=`<rect x="${cx-bw/2}" y="${y(p.t)}" width="${bw}" height="${H-pb-y(p.t)}" rx="2" fill="${last?"#E3B341":"rgba(227,179,65,.4)"}"/><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="#A7AFC0">${ML(p.m)}</text>`});
 return `<div class="tbl"><svg width="100%" viewBox="0 0 ${w} ${H}" style="max-width:${w}px;height:auto;display:block" role="img" aria-label="Total debt by month">${g}</svg></div>`;
}

function coachLoad(id){return S.clients.filter(c=>c.coach===id).length}
const certified=()=>S.coaches.filter(co=>co.status==="certified");

function ownerView(){
 const active=S.clients.filter(c=>c.coach);
 const sc=active.map(c=>({c,s:stats(c),f:flags(c)}));
 const withS=sc.filter(x=>x.s);
 const avg=withS.length?Math.round(withS.reduce((a,x)=>a+x.s.score,0)/withS.length):0;
 const urgent=sc.filter(x=>x.f.some(f=>urgentKinds.includes(f[2])));
 const league=S.coaches.map(co=>{const m=withS.filter(x=>x.c.coach===co.id);const start=m.reduce((a,x)=>a+x.s.start,0),lat=m.reduce((a,x)=>a+x.s.latest,0);
  return {co,n:coachLoad(co.id),avg:m.length?Math.round(m.reduce((a,x)=>a+x.s.score,0)/m.length):null,red:start?(start-lat)/start*100:null,fl:sc.filter(x=>x.c.coach===co.id&&x.f.length).length}}).sort((a,b)=>(b.avg??-1)-(a.avg??-1));
 const waiting=S.clients.filter(c=>!c.coach).sort((a,b)=>a.signed.localeCompare(b.signed));
 const sug=suggest();
 const coachOpts=(sel,withLoad)=>certified().map(co=>{const l=coachLoad(co.id),full=l>=co.cap;return `<option value="${co.id}" ${co.id===sel?"selected":""}>${esc(co.name)}${withLoad?` · ${l}/${co.cap}${full?" full":""}`:""}</option>`}).join("");
 return `
 <div class="stack" style="margin-top:20px">
  <div><div class="eyebrow">Owner view · only you see this</div><h1>MFG at a <u>glance</u></h1></div>

 ["q1","Does your monthly pay cover rent, food, transport AND all your minimum debt payments?",["Yes, easily","Just","No"]],

function coachAppView(){
 const a=SU.app,err=SU.err?`<div class="suerr" role="alert">${esc(SU.err)}</div>`:"";
 if(SU.step===9)return `<div class="eyebrow">Application received</div><h1>Thank you, ${esc((a.name||"").split(" ")[0])}. <u>We'll be in touch.</u></h1>

 const provs=["Eastern Cape","Free State","Gauteng","KwaZulu-Natal","Limpopo","Mpumalanga","North West","Northern Cape","Western Cape","Outside South Africa"];

 if(SU.step===3)body=`

   <div class="card"><label class="switch"><input type="checkbox" id="suConsent" ${SU.consent?"checked":""}><span><b>Share my numbers with the MFG coach assigned to me</b><br><span class="note">You can switch this off any time in your account.</span></span></label></div>
   <label class="f" style="flex-direction:row;gap:10px;align-items:flex-start;font-size:14px;color:var(--cream)"><input type="checkbox" id="suTerms" style="margin-top:4px;accent-color:var(--gold)"><span>I agree to the Terms and Privacy Policy. <span class="note">(Wording to be written and checked by an attorney.)</span></span></label>
   ${err}<div class="row" style="justify-content:space-between"><button class="btn ghost" type="button" data-su="back">← Back</button><button class="btn gold" type="submit">Join MFG</button></div>

 if(SU.step===4){const st=STAGES[suStage(SU.q)-1];body=`

document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.role){S.role=b.dataset.role;save();render();return}
 if(b.dataset.sel){S.sel=b.dataset.sel;save();render();if(innerWidth<920)$("#detail").scrollIntoView({behavior:"smooth"});return}
 if(b.dataset.tab){S.tab=b.dataset.tab;save();render();return}
 if(b.dataset.sso){SU.method=b.dataset.sso;SU.err="";SU.step=2;render();toast(`Prototype: pretending you signed in with ${b.dataset.sso}.`);return}
 if(b.dataset.kind){SU={kind:b.dataset.kind,app:{},step:1,method:null,email:"",name:"",wa:"",need:"",heard:"",q:{},consent:true,err:""};render();return}
 if(b.dataset.approve){const a=S.apps.find(x=>x.id===b.dataset.approve);S.apps=S.apps.filter(x=>x!==a);S.coaches.push({id:uid(),name:a.name,email:a.email,cap:Math.max(1,a.cap||5),added:daysAgo(0),pending:true,status:"training"});save();render();toast(`${a.name} approved for training. Mark them certified when they pass.`);return}
 if(b.dataset.decline){const a=S.apps.find(x=>x.id===b.dataset.decline);S.apps=S.apps.filter(x=>x!==a);save();render();toast(`${a.name}'s application declined. In the real version they get a kind message.`);return}
 if(b.dataset.gate){const c=S.clients.find(x=>x.id===b.dataset.gate);c.week=Math.min(12,c.week+1);save();render();toast(`${c.name.split(" ")[0]} moves to Week ${c.week}: ${WEEKS[c.week][0]}`);return}
 if(b.dataset.gateback){const c=S.clients.find(x=>x.id===b.dataset.gateback);c.week=Math.max(1,c.week-1);save();render();return}
 if(b.dataset.brief){S.briefOpen=S.briefOpen===b.dataset.brief?null:b.dataset.brief;save();render();return}
 if(b.dataset.refdone){const [id,i]=b.dataset.refdone.split(":");const c=S.clients.find(x=>x.id===id);c.refs[+i].done=true;save();render();toast("Referral marked as followed up");return}
 if(b.dataset.help){const c=S.clients.find(x=>x.id===S.clientId);
   if(b.dataset.help==="open"){S.helpOpen=true;render();return}
   if(b.dataset.help==="close"){S.helpOpen=false;render();return}
   if(b.dataset.help==="send"){c.help=daysAgo(0);S.helpOpen=false;save();render();toast(`${coachName(c.coach)} has been told. You're not alone in this.`);return}}
 if(b.dataset.setw||b.dataset.setp){const c=S.clients.find(x=>x.id===S.clientId);const t=c.setts.find(x=>x.id===(b.dataset.setw||b.dataset.setp));
   if(b.dataset.setw)t.written=true;else t.paid=true;save();render();toast(b.dataset.setw?"Agreement recorded. Now pay exactly as agreed.":"Payment recorded. Ask for your paid-up letter.");return}
 if(b.dataset.certify){const co=S.coaches.find(x=>x.id===b.dataset.certify);co.status="certified";save();render();toast(`${co.name} is certified and can now be matched with clients`);return}
 if(b.dataset.su==="back"){suRead();SU.err="";SU.step--;render();return}
 if(b.dataset.su==="restart"){SU={kind:SU.kind,app:{},step:1,method:null,email:"",name:"",wa:"",need:"",heard:"",q:{},consent:true,err:""};render();return}
 if(b.dataset.su==="owner"){S.role="owner";save();render();window.scrollTo(0,0);return}
 if(b.dataset.su==="tracker"){toast("In the real version this opens their Debt Ladder Tracker, saved to their account.");return}
 if(b.id==="resetDemo"){S=seed();save();render();toast("Sample data reset.");return}
 if(b.id==="coachOpen"){$("#coachBox").innerHTML=`<form id="coachForm" class="stack" style="margin:12px 0;padding:14px;border:1px dashed var(--line);border-radius:6px"><div class="two"><label class="f">Coach's name<input id="cName" placeholder="e.g. Thandeka M." required></label><label class="f">Email (their login)<input id="cEmail" type="email" placeholder="name@example.com" required></label></div><div class="two"><label class="f">WhatsApp<input id="cNum" inputmode="tel" placeholder="e.g. 082 000 0000"></label><label class="f">Most clients at once<input id="cCap" inputmode="numeric" value="8"></label></div><div class="row"><button class="btn gold small" type="submit">Add coach and send login invite</button><button class="btn ghost small" type="button" id="coachCancel">Cancel</button></div><p class="note">In the real version they get an email to set their password. Prototype: nothing is sent.</p></form>`;$("#cName").focus();return}
 if(b.id==="coachCancel"){$("#coachBox").innerHTML="";return}
 if(b.id==="simSignup"){const names=["Lindiwe K.","Sifiso M.","Precious N.","Bongani T.","Karabo S.","Andile V."];const needs=[["Debt freedom","1 · Survival"],["Questions about debt review","2 · Stability"],["Building wealth","3 · Security"],["Debt freedom","2 · Stability"]];const n=needs[Math.floor(Math.random()*needs.length)];
   const c={id:uid(),name:names[Math.floor(Math.random()*names.length)],coach:null,consent:false,status:"new",signed:daysAgo(0),need:n[0],stage:n[1],source:"Website",startAcc:0,openAcc:0,newCredit:false,lastUpdate:null,load:null,gapCut:null,rl:[],debts:[],history:[],notes:[]};
   S.clients.push(c);save();render();toast(`New sign-up: ${c.name} is in the waiting room.`);return}
 if(false){$("#inviteBox").innerHTML=`<form id="inviteForm" class="card stack"><label class="f">Client's first name and initial<input id="iName" placeholder="e.g. Lindiwe K." required></label><label class="f">WhatsApp number<input id="iNum" inputmode="tel" placeholder="e.g. 082 000 0000"></label><div><button class="btn gold small" type="submit">Create invite link</button></div></form>`;$("#iName").focus();return}
 if(b.dataset.copy){const t=b.dataset.copy;navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast("Link copied."),()=>toast("Select the link and copy it."));return}
 if(b.dataset.assign){const co=$("#as-"+b.dataset.assign).value;const c=S.clients.find(x=>x.id===b.dataset.assign);const coach=S.coaches.find(x=>x.id===co);if(coachLoad(co)>=coach.cap){toast(`${coach.name} is full. Pick another coach or raise their capacity.`);return}c.coach=co;c.status="active";c.lastUpdate=c.signed;save();render();toast(`${c.name} is now with ${coachName(co)}`);return}
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.id==="coachSel"){S.coachId=el.value;S.sel=null;save();render();return}
 if(el.id==="clientSel"){S.clientId=el.value;save();render();return}
 if(el.id==="consent"){const c=S.clients.find(x=>x.id===S.clientId);c.consent=el.checked;
   save();render();toast(el.checked?"Sharing on. Your coach can now see your numbers.":"Sharing off. Your coach can no longer see your numbers.");return}
 if(el.dataset.setl){const c=S.clients.find(x=>x.id===S.clientId);const t=c.setts.find(x=>x.id===el.dataset.setl);const file=el.files&&el.files[0];if(!file)return;
   t.letter=file.name;const i=c.debts.findIndex(d=>d[0]===t.who);if(i>=0){c.debts.splice(i,1);c.openAcc=Math.max(0,(c.openAcc||1)-1)}
   c.closedCards=[...(c.closedCards||[]),t.who.split(" · ")[0]];save();render();toast("Account closed. That's a real win.");return}
 if(el.dataset.hw!==undefined){const c=S.clients.find(x=>x.id===S.clientId);c.notes[c.notes.length-1].hw[+el.dataset.hw].ok=el.checked;save();render();return}
 if(el.dataset.move){const c=S.clients.find(x=>x.id===el.dataset.move);const coach=S.coaches.find(x=>x.id===el.value);if(coachLoad(el.value)>=coach.cap){toast(`${coach.name} is full. Raise their capacity first.`);render();return}c.coach=el.value;save();render();toast(`${c.name} moved to ${coachName(el.value)}`);return}
});
document.addEventListener("submit",e=>{
 e.preventDefault();
 const f=e.target;
 if(f.id==="refForm"){const c=S.clients.find(x=>x.id===S.sel);const why=$("#rWhy").value.trim();if(!why){toast("Add the reason for the referral.");return}
  c.refs=c.refs||[];c.refs.push({d:daysAgo(0),to:$("#rTo").value,why,done:false});save();render();toast("Referral logged. It's in the owner's referral log too.");return}
 if(f.id==="callForm"){const c=S.clients.find(x=>x.id===S.clientId);c.calls.push({d:daysAgo(0),who:$("#cWho").value,ref:$("#cRef").value.trim(),offer:$("#cOffer").value.trim(),agreed:$("#cAgreed").value.trim(),written:$("#cWritten").checked});save();render();toast("Call saved. Your coach can see it.");return}
 if(f.id==="settForm"){const c=S.clients.find(x=>x.id===S.clientId);const d=c.debts[+$("#sWho").value];const amt=Number($("#sAmt").value.replace(/[^\d.]/g,""));if(!amt){toast("Add the settlement amount they offered.");return}
  if(amt>=d[1]){toast("A settlement should be less than the balance. Check the figure.");return}
  c.setts.push({id:uid(),who:d[0],bal:d[1],agreed:amt,written:false,paid:false,letter:null});save();render();toast("Settlement saved. Next: get it in writing.");return}
 if(f.id==="fbForm"){const c=S.clients.find(x=>x.id===S.clientId);const pick=k=>{const r=document.querySelector(`input[name=fb-${k}]:checked`);return r?r.value:null};
  const ans={judged:pick("judged"),clearer:pick("clearer"),product:pick("product"),note:$("#fbNote").value.trim()};if(!ans.judged||!ans.clearer||!ans.product){toast("Answer the three questions first.");return}
  c.fb=c.fb||{};c.fb[+f.dataset.m]=ans;save();render();toast("Thank you. Your answers help keep coaching kind and useful.");return}
 if(f.id==="coachApp"){const g=id=>$("#"+id).value.trim();
  SU.app={name:g("caName"),email:g("caEmail"),wa:g("caWa"),prov:g("caProv"),exp:g("caExp"),book:g("caBook"),cap:parseInt(g("caCap"))||0,why:g("caWhy"),quals:g("caQuals")};const a=SU.app;
  const miss=a.name.split(/\s+/).filter(Boolean).length<2?"Add your first name and surname.":!/^\S+@\S+\.\S+$/.test(a.email)?"Enter a valid email address.":a.wa.replace(/\D/g,"").length<9?"Add your WhatsApp number.":!a.prov?"Choose your province.":!a.exp?"Choose your experience.":!a.book?"Tell us if you've read the book.":!(a.cap>0)?"Say how many clients you could take.":a.why.length<20?"Tell us a little more about why you want to coach (a few sentences).":!$("#caAgree").checked?"Tick the box to confirm you understand how MFG coaches work.":"";
  if(miss){SU.err=miss;render();return}
  const parts=a.name.split(/\s+/).filter(Boolean);S.apps=S.apps||[];S.apps.push({id:uid(),...a,name:parts[0]+" "+parts[parts.length-1][0].toUpperCase()+".",date:daysAgo(0)});save();SU.err="";SU.step=9;render();window.scrollTo(0,0);return}
 if(f.id==="su1"){suRead();const pw=$("#suPass").value;
  if(!/^\S+@\S+\.\S+$/.test(SU.email)){SU.err="Enter a valid email address, like name@example.com.";render();return}
  if(pw.length<8){SU.err="Your password needs 8 or more characters.";render();return}
  SU.method="email";SU.err="";SU.step=2;render();return}
 if(f.id==="su2"){suRead();
  if(SU.name.split(/\s+/).filter(Boolean).length<2){SU.err="Add your first name and surname.";render();return}
  if(SU.wa.replace(/\D/g,"").length<9){SU.err="Add your WhatsApp number so your coach can reach you.";render();return}
  if(!SU.need){SU.err="Choose what you need help with.";render();return}
  if(!SU.heard){SU.err="Tell us how you heard about MFG.";render();return}
  SU.err="";SU.step=3;render();return}
 if(f.id==="su3"){suRead();
  if(QS.some(([k])=>!SU.q[k])){SU.err="Answer all four questions. There are no wrong answers.";render();return}
  if(!$("#suTerms").checked){SU.err="Tick the box to agree to the Terms and Privacy Policy.";render();return}
  const parts=SU.name.split(/\s+/).filter(Boolean);const short=parts[0]+" "+parts[parts.length-1][0].toUpperCase()+".";
  const st=suStage(SU.q);
  S.clients.push({id:uid(),name:short,coach:null,consent:SU.consent,status:"new",signed:daysAgo(0),need:SU.need,stage:st+" · "+STAGES[st-1].name,source:SU.heard,method:SU.method,startAcc:0,openAcc:0,newCredit:false,lastUpdate:null,load:null,gapCut:null,rl:[],debts:[],history:[],notes:[],borrowing:SU.q.q2==="Yes",ef:0,assetInc:0,prev:null});
  save();SU.err="";SU.step=4;render();window.scrollTo(0,0);return}
 if(f.id==="noteForm"){const c=S.clients.find(x=>x.id===S.sel);
  const hw=$("#nHw").value.split("\n").map(x=>x.trim()).filter(Boolean).map(t=>({t,ok:false}));
  if(!$("#nCovered").value.trim()&&!hw.length&&!$("#nMsg").value.trim()){toast("Add what you covered, homework or a message first.");return}
  c.notes.push({d:$("#nDate").value,covered:$("#nCovered").value.trim(),hw,next:$("#nNext").value||null,msg:$("#nMsg").value.trim()});
  save();render();toast(`Note saved. ${c.name.split(" ")[0]} sees it in their account.`);return}
 if(f.id==="updForm"){const c=S.clients.find(x=>x.id===S.clientId);
  const raw=$("#uTotal").value.replace(/[^\d.]/g,"");if(raw===""){toast("Add your total debt.");return}const t=Number(raw);
  const before=stageOf(c);if(before)c.prev={stage:before.stage,rung:before.rung};
  const mi=$("#uMins").value.replace(/[^\d.]/g,""),gr=$("#uGross").value.replace(/[^\d.]/g,"");
  if(mi!==""){const nm=Number(mi);if(c.gapCut!==null&&c.mins!==undefined)c.gapCut+= (c.mins||0)-nm;c.mins=nm}
  if(gr!=="")c.gross=Number(gr);
  if(c.gross)c.load=Math.round((c.mins||0)/c.gross*1000)/10;
  c.borrowing=$("#uBorrow").value==="yes";c.ef=Number($("#uEf").value);const pd=parseInt($("#uPayday").value);if(pd>=1&&pd<=31)c.payday=pd;
  c.rl=c.rl.filter(r=>r!=="Borrowing to pay debts");if(c.borrowing)c.rl.push("Borrowing to pay debts");
  const m=monthsBack(0);c.history=c.history.filter(h=>h.m!==m);c.history.push({m,t});c.history.sort((a,b)=>a.m.localeCompare(b.m));
  const o=parseInt($("#uOpen").value);if(!isNaN(o)){if(!c.startAcc)c.startAcc=o;c.openAcc=o}
  c.newCredit=$("#uCredit").value==="yes";c.lastUpdate=daysAgo(0);
  save();render();const mv=move(c);toast((mv?mv.txt+" ":"")+(c.consent?"Your coach can see it.":"Switch on sharing so your coach can see it."));return}
 if(f.id==="coachForm"){const name=$("#cName").value.trim(),email=$("#cEmail").value.trim();if(!name||!email){toast("Add a name and email.");return}
  const cap=Math.max(1,parseInt($("#cCap").value)||8);S.coaches.push({id:uid(),name,email,cap,added:daysAgo(0),pending:true,status:"certified"});save();render();toast(`${name} added. Login invite would go to ${email}.`);return}
 if(f.id==="inviteForm"){const name=$("#iName").value.trim();if(!name)return;
  const id=uid();S.clients.push({id,name,coach:S.coachId,consent:false,status:"invited",startAcc:0,openAcc:0,newCredit:false,lastUpdate:null,load:null,gapCut:null,rl:[],debts:[],history:[],notes:[]});
  const link="mlinjanafinancialgroup.com/join/"+id.toUpperCase();save();S.sel=id;render();
  $("#inviteBox").innerHTML=`<div class="card stack"><div class="note">Send this to ${esc(name)} on WhatsApp. When they sign up through it, they're linked to you.</div><code style="font-family:var(--mono);color:var(--gold2);user-select:all;overflow-wrap:anywhere">${link}</code><div class="row"><button class="btn ghost small" data-copy="https://${link}">Copy link</button><span class="note">Prototype: no message is sent.</span></div></div>`;return}
});
render();
})();
</script>
